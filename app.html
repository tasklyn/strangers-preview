<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Strangers Coffee | تطبيق سترينجرز</title>
<meta name="description" content="موك أب تفاعلي عالي الدقة لتطبيق سترينجرز كوفي — عضوية، مقاعد، جلسات، وطلبات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --bg:#FAF7F2; --surface:#EFE6D8; --surface-2:#F4EDE1;
  --ink:#141110; --ink-soft:#3A322B; --brown:#4A3322; --brown-soft:#6B4F38;
  --gold:#B8955A; --gold-deep:#9A7A45; --gold-faint:rgba(184,149,90,.16);
  --line:rgba(74,51,34,.14); --line-dark:rgba(250,247,242,.14);
  --dark:#141110; --dark-2:#1C1714; --dark-3:#241C15;
  --green:#5E7D5A; --red:#9A3324;
  --font-ar:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-latin:"Fraunces",serif;
  --font-mono:"IBM Plex Mono",monospace;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --radius:16px; --radius-lg:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-ar);
  background:radial-gradient(1200px 700px at 50% 0%,#211913 0%,#141110 55%,#0F0C0A 100%);
  color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100dvh; overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
img{max-width:100%;display:block}
.latin{font-family:var(--font-latin)} .mono{font-family:var(--font-mono)}
::selection{background:var(--gold);color:#fff}

/* ================= PROTOTYPE STAGE ================= */
.proto-bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.proto-bg .dust{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.2;
  animation:dust var(--dur,12s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes dust{0%,100%{transform:translate(0,0);opacity:.08}50%{transform:translate(var(--dx,14px),var(--dy,-30px));opacity:.4}}
.proto-glow{position:absolute;inset:0;background:radial-gradient(600px 400px at 50% 42%,rgba(184,149,90,.12),transparent 62%)}

.stage{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:clamp(1rem,4vh,3rem) 1rem 2rem;perspective:1600px}
.stage-head{text-align:center;color:var(--bg);margin-bottom:clamp(1rem,3vh,2rem);opacity:.96}
.stage-head .st-logo{width:58px;height:58px;color:var(--gold);margin:0 auto .7rem}
.stage-head h1{font-family:var(--font-latin);font-weight:500;font-size:clamp(1.3rem,3.4vw,1.9rem);letter-spacing:.02em}
.stage-head p{font-size:.82rem;color:rgba(250,247,242,.55);margin-top:.35rem;font-family:var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.stage-controls{display:flex;gap:.6rem;margin-top:1rem;justify-content:center;flex-wrap:wrap}
.sc-btn{font-family:var(--font-mono);font-size:.74rem;border:1px solid rgba(184,149,90,.4);border-radius:999px;
  padding:.45rem 1rem;color:var(--gold);transition:all .3s var(--ease-out);min-height:36px;background:rgba(184,149,90,.05)}
.sc-btn:hover{background:var(--gold);color:var(--dark);transform:translateY(-2px)}
.sc-btn.on{background:var(--gold);color:var(--dark)}

/* ================= PHONE FRAME ================= */
.phone-wrap{transform-style:preserve-3d;transition:transform .5s var(--ease-out);will-change:transform}
.phone{
  width:min(390px,94vw); aspect-ratio:390/844; position:relative;
  background:linear-gradient(150deg,#2A211A,#141110 60%,#241C15);
  border-radius:56px; padding:13px;
  box-shadow:0 60px 120px -40px rgba(0,0,0,.75), 0 0 0 2px rgba(184,149,90,.28), inset 0 0 0 2px rgba(0,0,0,.5);
}
.phone::before{content:"";position:absolute;inset-inline:38%;top:8px;height:5px;border-radius:5px;background:rgba(0,0,0,.4);z-index:60}
.screen{
  position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;
}
/* notch */
.notch{position:absolute;top:0;inset-inline:0;height:34px;z-index:50;display:flex;justify-content:center;pointer-events:none}
.notch .pill{margin-top:9px;width:120px;height:30px;background:#0B0908;border-radius:999px}
/* status bar */
.statusbar{position:absolute;top:0;inset-inline:0;height:52px;z-index:40;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-family:var(--font-mono);font-size:.8rem;font-weight:500;
  color:var(--ink);pointer-events:none}
.statusbar.on-dark{color:var(--bg)}
.statusbar .sb-time{padding-top:6px;letter-spacing:.02em}
.statusbar .sb-right{display:flex;align-items:center;gap:6px;padding-top:6px}
.statusbar svg{display:block}

/* screens container */
.screens{position:absolute;inset:0;overflow:hidden}
.app-screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.app-screen.active{display:flex;animation:scrIn .42s var(--ease-out)}
.app-screen.back-in.active{animation:scrBack .42s var(--ease-out)}
@keyframes scrIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
html[dir="ltr"] @keyframes scrIn{from{transform:translateX(-24px)}}
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:96px}
.scroll-area.no-tab{padding-bottom:24px}
.scroll-area::-webkit-scrollbar{width:0}
.pad-top{padding-top:56px}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;
  padding:56px 18px 12px;background:rgba(250,247,242,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.appbar.on-surface{background:rgba(244,237,225,.92)}
.appbar .ab-back{width:38px;height:38px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .25s}
.appbar .ab-back:active{background:var(--gold-faint)}
.appbar .ab-back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[dir="ltr"] .appbar .ab-back svg{transform:scaleX(-1)}
.appbar .ab-title{font-weight:600;font-size:1.02rem}
.appbar .ab-sub{font-size:.72rem;color:var(--brown-soft)}
.appbar .ab-spacer{margin-inline-start:auto}
.ab-icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative}
.ab-icon-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.px{padding-inline:18px}
.mt{margin-top:16px}.mt-s{margin-top:10px}.mt-l{margin-top:24px}

/* ================= TAB BAR ================= */
.tabbar{position:absolute;bottom:0;inset-inline:0;height:82px;z-index:45;
  background:rgba(250,247,242,.86);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--line);display:flex;align-items:flex-start;padding:8px 6px 0;justify-content:space-around}
.tabbar.hidden{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;color:var(--brown-soft);transition:color .25s;position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:.6rem;font-weight:600}
.tab.active{color:var(--gold-deep)}
.tab.active svg{stroke:var(--gold-deep)}
.tab-qr{flex:0 0 auto;margin-top:-22px}
.tab-qr .qr-fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(150deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -8px rgba(184,149,90,.7);transition:transform .3s var(--ease-spring)}
.tab-qr:active .qr-fab{transform:scale(.92)}
.tab-qr .qr-fab svg{width:26px;height:26px;stroke:var(--dark);stroke-width:1.9}
.tab-qr span{font-size:.6rem;font-weight:600;color:var(--brown-soft);margin-top:4px}
.tab .badge{position:absolute;top:2px;inset-inline-end:22%;background:var(--red);color:#fff;font-family:var(--font-mono);
  font-size:.56rem;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ================= COMPONENTS ================= */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card-surf{background:var(--surface-2)}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.2em;color:var(--gold-deep);text-transform:uppercase;display:block}
.sec-title{font-size:1.08rem;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.sec-title .more{font-size:.74rem;color:var(--gold-deep);font-weight:600}
.muted{color:var(--brown-soft);font-size:.86rem;line-height:1.7}
.price{font-family:var(--font-mono);color:var(--gold-deep);font-weight:500}
.pill-tag{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:600;border-radius:999px;padding:.28rem .7rem}
.pill-gold{background:var(--gold-faint);color:var(--gold-deep)}
.pill-green{background:rgba(94,125,90,.16);color:var(--green)}
.pill-dark{background:var(--dark);color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;font-size:.92rem;
  border-radius:14px;padding:.85rem 1.4rem;min-height:50px;transition:transform .25s var(--ease-spring),box-shadow .3s,background .25s;width:100%}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--dark);box-shadow:0 10px 24px -12px rgba(184,149,90,.8)}
.btn-gold:active{background:var(--gold-deep)}
.btn-dark{background:var(--dark);color:var(--bg)}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink);background:var(--bg)}
.btn-sm{min-height:42px;padding:.55rem 1rem;font-size:.82rem;width:auto;border-radius:12px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* quick actions grid */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:16px;
  background:var(--surface-2);border:1px solid var(--line);transition:transform .3s var(--ease-spring),background .25s}
.qa:active{transform:scale(.94);background:var(--gold-faint)}
.qa .qa-ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.qa .qa-ic svg{width:21px;height:21px;stroke:var(--gold-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qa span{font-size:.64rem;font-weight:600;color:var(--ink-soft);text-align:center;line-height:1.3}

/* hero membership mini */
.home-hero{background:linear-gradient(150deg,var(--dark) 0%,var(--dark-2) 55%,var(--dark-3) 100%);color:var(--bg);
  border-radius:0 0 26px 26px;padding:60px 18px 22px;position:relative;overflow:hidden}
.home-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 90% 0%,rgba(184,149,90,.22),transparent 60%);pointer-events:none}
.hh-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.hh-hi{font-size:.78rem;color:rgba(250,247,242,.6)}
.hh-name{font-size:1.15rem;font-weight:600;margin-top:1px}
.hh-bell{width:40px;height:40px;border-radius:13px;background:rgba(250,247,242,.08);display:flex;align-items:center;justify-content:center;position:relative}
.hh-bell svg{width:20px;height:20px;stroke:var(--bg);fill:none;stroke-width:1.7}
.hh-bell .dot{position:absolute;top:9px;inset-inline-end:11px;width:8px;height:8px;background:var(--gold);border-radius:50%;border:2px solid var(--dark)}
.hh-card{position:relative;z-index:2;margin-top:16px;border-radius:18px;padding:15px 16px;
  background:linear-gradient(135deg,rgba(184,149,90,.28),rgba(184,149,90,.07));border:1px solid rgba(184,149,90,.4);
  display:flex;align-items:center;justify-content:space-between}
.hh-card .hc-tier{font-family:var(--font-latin);font-style:italic;color:var(--gold);font-size:.9rem}
.hh-card .hc-pts{font-family:var(--font-mono);font-size:1.5rem;color:var(--bg);line-height:1;margin-top:4px}
.hh-card .hc-pts small{font-size:.62rem;color:rgba(250,247,242,.55);font-family:var(--font-ar)}
.hh-card .hc-qr{width:60px;height:60px;background:var(--bg);border-radius:12px;padding:6px;flex-shrink:0}
.hh-card .hh-qr{width:60px;height:60px;background:var(--bg);border-radius:12px;padding:6px;flex-shrink:0}
.hh-card .hh-qr svg{width:100%;height:100%;display:block}
.hh-card .hc-qr svg{width:100%;height:100%}
.hh-progress{margin-top:14px;position:relative;z-index:2}
.hh-bar{height:7px;border-radius:999px;background:rgba(250,247,242,.14);overflow:hidden}
.hh-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));width:68%}
.hh-plabels{display:flex;justify-content:space-between;font-size:.62rem;color:rgba(250,247,242,.55);margin-top:6px}

/* occupancy branch card */
.occ-card{display:flex;align-items:center;gap:14px}
.occ-ring{--p:64;width:56px;height:56px;flex-shrink:0;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface) 0);display:flex;align-items:center;justify-content:center}
.occ-ring i{width:42px;height:42px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:.8rem;font-weight:500;color:var(--gold-deep)}
.occ-body h4{font-size:.98rem;font-weight:600}
.occ-body p{font-size:.76rem;color:var(--brown-soft);margin-top:2px}

/* spotlight product */
.spot{display:flex;gap:13px;align-items:center}
.spot img{width:78px;height:78px;border-radius:14px;object-fit:cover;flex-shrink:0}
.spot h4{font-size:.96rem;font-weight:600}
.spot p{font-size:.76rem;color:var(--brown-soft);margin-top:2px}

/* horizontal rail */
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rail-card{flex:0 0 150px;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.rail-card img{width:100%;height:104px;object-fit:cover}
.rail-card .rc-b{padding:10px 11px}
.rail-card h5{font-size:.82rem;font-weight:600}
.rail-card .price{font-size:.78rem;margin-top:3px;display:block}

/* status banner (active order) */
.order-banner{background:var(--dark);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.order-banner .ob-ic{width:42px;height:42px;border-radius:12px;background:rgba(184,149,90,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.order-banner .ob-ic svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.7}
.order-banner h4{font-size:.9rem;font-weight:600}
.order-banner p{font-size:.72rem;color:rgba(250,247,242,.6);margin-top:2px}
.order-banner .ob-arrow{margin-inline-start:auto;color:var(--gold)}

/* ================= SPLASH ================= */
#s-splash{background:radial-gradient(900px 600px at 50% 40%,#241C15,#141110 70%);align-items:center;justify-content:center;color:var(--bg)}
.splash-inner{display:flex;flex-direction:column;align-items:center;text-align:center;animation:splashUp 1s var(--ease-out)}
@keyframes splashUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.splash-logo{width:120px;height:120px;color:var(--gold);animation:splashSpin 6s ease-in-out infinite alternate}
@keyframes splashSpin{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.splash-inner h1{font-family:var(--font-latin);font-weight:500;font-size:1.7rem;margin-top:18px;letter-spacing:.02em}
.splash-inner p{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.22em;color:rgba(250,247,242,.5);margin-top:8px;text-transform:uppercase}
.splash-load{width:120px;height:3px;border-radius:3px;background:rgba(250,247,242,.12);margin-top:26px;overflow:hidden}
.splash-load i{display:block;height:100%;background:var(--gold);width:0;animation:load 2.4s var(--ease-out) forwards}
@keyframes load{to{width:100%}}
.splash-skip{position:absolute;bottom:34px;font-family:var(--font-mono);font-size:.72rem;color:rgba(250,247,242,.4);letter-spacing:.1em}

/* ================= ONBOARDING ================= */
#s-onboard{background:var(--bg)}
.onb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.onb-track::-webkit-scrollbar{display:none}
.onb-slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:70px 34px 20px}
.onb-visual{width:200px;height:200px;border-radius:36px;background:linear-gradient(150deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:30px;position:relative;overflow:hidden}
.onb-visual::after{content:"";position:absolute;inset:0;background:radial-gradient(140px 120px at 70% 20%,rgba(184,149,90,.18),transparent 60%)}
.onb-visual svg{width:88px;height:88px;stroke:var(--gold-deep);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:2}
.onb-slide h2{font-size:1.35rem;font-weight:700}
.onb-slide p{color:var(--brown-soft);font-size:.9rem;margin-top:10px;max-width:30ch;line-height:1.8}
.onb-foot{padding:14px 26px 30px;display:flex;flex-direction:column;gap:16px}
.onb-dots{display:flex;gap:8px;justify-content:center}
.onb-dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:all .3s}
.onb-dots i.on{width:24px;background:var(--gold)}

/* ================= FORMS ================= */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.field input,.field select{border:1.5px solid var(--line);border-radius:13px;padding:.8rem 1rem;background:var(--bg);min-height:50px;transition:border-color .25s,box-shadow .25s;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-faint)}
.field .err{font-size:.72rem;color:var(--red);display:none}
.field.invalid input,.field.invalid select{border-color:var(--red)}
.field.invalid .err{display:block}
.check-row{display:flex;align-items:flex-start;gap:10px;font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;line-height:1.6}
.check-row input{width:20px;height:20px;accent-color:var(--gold);margin-top:2px;flex-shrink:0}
.check-row a{color:var(--gold-deep);font-weight:600}

/* OTP */
.otp-row{display:flex;gap:12px;justify-content:center;direction:ltr;margin:8px 0 18px}
.otp-row input{width:60px;height:70px;border:1.5px solid var(--line);border-radius:16px;text-align:center;
  font-family:var(--font-mono);font-size:1.7rem;color:var(--ink);background:var(--surface-2);transition:all .25s}
.otp-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-faint);background:var(--bg)}
.otp-timer{text-align:center;font-size:.82rem;color:var(--brown-soft)}
.otp-timer b{font-family:var(--font-mono);color:var(--gold-deep)}
.otp-resend{color:var(--gold-deep);font-weight:600}

/* ================= MEMBERSHIP CARD 3D ================= */
.mcard-stage{perspective:1300px;padding:8px 0 4px}
.mcard{width:100%;aspect-ratio:1.586;position:relative;transform-style:preserve-3d;transition:transform .9s var(--ease-spring);cursor:pointer}
.mcard.flipped{transform:rotateY(180deg)}
html[dir="rtl"] .mcard.flipped{transform:rotateY(-180deg)}
.mc-face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;padding:18px;overflow:hidden;box-shadow:0 30px 60px -26px rgba(20,17,16,.6)}
.mc-front{background:linear-gradient(135deg,#1C1714 0%,#141110 55%,#241C15 100%);color:var(--bg);display:flex;flex-direction:column;justify-content:space-between}
.mc-front::after{content:"";position:absolute;inset:0;background:radial-gradient(320px 170px at 88% 8%,rgba(184,149,90,.24),transparent 60%);pointer-events:none}
.mc-back{background:linear-gradient(135deg,#B8955A,#9A7A45);color:var(--dark);transform:rotateY(180deg);display:flex;align-items:center;gap:16px}
.mc-brand{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.mc-brand svg{width:40px;height:40px;color:var(--gold)}
.mc-tier{font-family:var(--font-latin);font-style:italic;color:var(--gold);font-size:1rem;letter-spacing:.05em}
.mc-name{font-size:1.15rem;font-weight:600;position:relative;z-index:2}
.mc-num{font-family:var(--font-mono);font-size:.82rem;color:rgba(250,247,242,.65);letter-spacing:.16em;margin-top:3px}
.mc-since{font-family:var(--font-mono);font-size:.62rem;color:rgba(250,247,242,.45);letter-spacing:.12em;position:relative;z-index:2}
.mc-qr{width:96px;height:96px;background:var(--bg);border-radius:12px;padding:7px;flex-shrink:0}
.mc-qr svg{width:100%;height:100%}
.mc-barcode{flex:1;display:flex;flex-direction:column;gap:8px}
.mc-barcode svg{width:100%;height:44px}
.mc-barcode small{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.2em;color:rgba(20,17,16,.7)}
.flip-hint{text-align:center;font-size:.72rem;color:var(--brown-soft);margin-top:10px}

/* tier progress */
.tier-track{display:flex;align-items:center;margin-top:6px}
.tier-step{flex:1;text-align:center;position:relative}
.tier-step .ts-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line);margin:0 auto 6px}
.tier-step.done .ts-dot{background:var(--gold);border-color:var(--gold)}
.tier-step.current .ts-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-faint)}
.tier-step span{font-size:.66rem;font-weight:600;color:var(--brown-soft)}
.tier-step.done span,.tier-step.current span{color:var(--gold-deep)}
.tier-line{position:absolute;top:6px;height:2px;background:var(--line);inset-inline:50%;width:100%;z-index:-1}

/* ================= QR FULLSCREEN ================= */
#s-qr .scroll-area{padding-bottom:96px}
.qr-full{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.qr-box{width:240px;height:240px;background:var(--bg);border-radius:24px;padding:18px;box-shadow:0 24px 50px -24px rgba(184,149,90,.5);border:1px solid var(--line)}
.qr-box svg{width:100%;height:100%}
.qr-mem{font-family:var(--font-mono);font-size:1rem;letter-spacing:.18em;color:var(--ink);margin-top:20px}
.qr-hint{color:var(--brown-soft);font-size:.84rem;margin-top:8px}

/* ================= BRANCHES ================= */
.branch-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.branch-row:last-child{border-bottom:none}
.branch-row .br-body{flex:1}
.branch-row h4{font-size:.98rem;font-weight:600}
.branch-row p{font-size:.74rem;color:var(--brown-soft);margin-top:2px}
.occ-bar{width:70px;flex-shrink:0}
.occ-bar .ob-t{height:6px;border-radius:999px;background:var(--surface);overflow:hidden}
.occ-bar .ob-t i{display:block;height:100%;border-radius:999px}
.occ-bar small{font-family:var(--font-mono);font-size:.64rem;display:block;text-align:end;margin-top:4px}

/* ================= SEAT MAP ================= */
.seatmap-panel{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:12px}
.seatmap-svg{width:100%;height:auto;display:block;touch-action:manipulation}
.seatmap-svg .seat{cursor:pointer;transition:opacity .25s}
.seatmap-svg .seat:active{opacity:.7}
.seatmap-svg .seat.selected .seat-shape{stroke:var(--ink);stroke-width:3}
.seat-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.72rem;color:var(--brown-soft)}
.seat-legend span{display:inline-flex;align-items:center;gap:6px}
.seat-legend i{width:12px;height:12px;border-radius:4px}

/* seat detail sheet rows */
.sd-id{font-family:var(--font-mono);font-size:1.5rem;color:var(--gold-deep)}
.sd-state{display:inline-block;border-radius:999px;padding:.24rem .8rem;font-size:.72rem;font-weight:600;margin-block:8px}
.sd-rows{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.sd-rows .row{display:flex;justify-content:space-between;font-size:.84rem;border-bottom:1px dashed var(--line);padding-bottom:8px}
.sd-rows .row:last-child{border-bottom:none}
.sd-rows .row b{font-weight:600}

/* ================= MENU ================= */
.menu-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;position:sticky;top:0;z-index:15;
  background:rgba(250,247,242,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.menu-tabs::-webkit-scrollbar{display:none}
.menu-tab{flex-shrink:0;font-size:.8rem;font-weight:600;padding:.5rem 1rem;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);transition:all .25s}
.menu-tab.active{background:var(--dark);color:var(--gold);border-color:var(--dark)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-item{border-radius:16px;overflow:hidden;background:var(--bg);border:1px solid var(--line);transition:transform .3s var(--ease-spring)}
.menu-item:active{transform:scale(.97)}
.menu-item .mi-img{height:110px;background-size:cover;background-position:center;position:relative}
.menu-item .mi-add{position:absolute;bottom:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -6px rgba(184,149,90,.8)}
.menu-item .mi-add svg{width:17px;height:17px;stroke:var(--dark);fill:none;stroke-width:2.4;stroke-linecap:round}
.menu-item .mi-b{padding:10px 11px}
.menu-item h5{font-size:.84rem;font-weight:600;line-height:1.4}
.menu-item .price{font-size:.8rem;margin-top:4px;display:block}
.menu-cat-title{font-size:1.05rem;font-weight:700;margin:4px 0 2px}

/* ================= PRODUCT DETAIL ================= */
.pd-hero{height:230px;background-size:cover;background-position:center;position:relative}
.pd-hero .pd-back{position:absolute;top:56px;inset-inline-start:16px;width:40px;height:40px;border-radius:13px;background:rgba(250,247,242,.9);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.pd-hero .pd-back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[dir="ltr"] .pd-hero .pd-back svg{transform:scaleX(-1)}
.opt-group{margin-top:18px}
.opt-group h4{font-size:.92rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.opt-group h4 small{font-family:var(--font-mono);font-size:.66rem;color:var(--brown-soft);font-weight:400}
.opt-chips{display:flex;flex-wrap:wrap;gap:8px}
.opt-chip{font-size:.82rem;font-weight:600;padding:.55rem 1rem;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-soft);transition:all .2s}
.opt-chip.on{background:var(--gold-faint);border-color:var(--gold);color:var(--gold-deep)}
.opt-chip .add{font-family:var(--font-mono);font-size:.7rem;opacity:.7}
.stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:42px;font-size:1.2rem;font-weight:600;color:var(--gold-deep);background:var(--surface-2)}
.stepper span{width:44px;text-align:center;font-family:var(--font-mono);font-weight:500}
.pairing{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:18px}
.pairing img{width:60px;height:60px;border-radius:12px;object-fit:cover}
.pairing h5{font-size:.86rem;font-weight:600}
.pairing p{font-size:.72rem;color:var(--brown-soft)}
.pairing .p-add{margin-inline-start:auto}

/* sticky add bar */
.sticky-bar{position:sticky;bottom:0;background:rgba(250,247,242,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;z-index:16}
.sticky-bar .sb-total{font-family:var(--font-mono);font-size:1.1rem;font-weight:500}
.sticky-bar .sb-total small{font-size:.68rem;color:var(--brown-soft);display:block;font-family:var(--font-ar)}

/* ================= CART ================= */
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:64px;height:64px;border-radius:13px;object-fit:cover;flex-shrink:0}
.cart-item .ci-b{flex:1}
.cart-item h5{font-size:.9rem;font-weight:600}
.cart-item .ci-opt{font-size:.7rem;color:var(--brown-soft);margin-top:2px;line-height:1.5}
.cart-item .price{font-size:.84rem;margin-top:4px;display:block}
.cart-empty{text-align:center;padding:60px 24px;color:var(--brown-soft)}
.cart-empty svg{width:64px;height:64px;stroke:var(--gold);opacity:.4;fill:none;stroke-width:1.3;margin:0 auto 16px}
.totals .row{display:flex;justify-content:space-between;font-size:.88rem;padding:6px 0;color:var(--ink-soft)}
.totals .row.grand{font-weight:700;font-size:1.05rem;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.totals .row.grand b{font-family:var(--font-mono)}
.seg{display:flex;gap:8px;background:var(--surface-2);border-radius:14px;padding:5px;border:1px solid var(--line)}
.seg button{flex:1;padding:.65rem;border-radius:10px;font-size:.84rem;font-weight:600;color:var(--ink-soft);transition:all .25s}
.seg button.on{background:var(--bg);color:var(--gold-deep);box-shadow:0 4px 10px -6px rgba(20,17,16,.3)}

/* order tracking */
.track-step{display:flex;gap:14px;padding-bottom:22px;position:relative}
.track-step:last-child{padding-bottom:0}
.track-step::before{content:"";position:absolute;top:32px;inset-inline-start:15px;bottom:-4px;width:2px;background:var(--line)}
.track-step:last-child::before{display:none}
.track-step.done::before{background:var(--gold)}
.track-dot{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:2}
.track-step.done .track-dot{background:var(--gold);border-color:var(--gold)}
.track-step.active .track-dot{background:var(--dark);border-color:var(--dark);box-shadow:0 0 0 4px var(--gold-faint)}
.track-dot svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.track-step.done .track-dot svg{stroke:var(--dark)}
.track-b h4{font-size:.94rem;font-weight:600}
.track-b p{font-size:.74rem;color:var(--brown-soft);margin-top:2px}
.track-step:not(.done):not(.active) .track-b h4{color:var(--brown-soft)}

/* ================= SESSION TIMER ================= */
.session-hero{background:linear-gradient(160deg,var(--dark),var(--dark-2));color:var(--bg);border-radius:0 0 26px 26px;padding:60px 18px 26px;text-align:center}
.timer-ring{width:210px;height:210px;margin:16px auto 0;position:relative}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring .tr-bg{fill:none;stroke:rgba(250,247,242,.12);stroke-width:11}
.timer-ring .tr-fg{fill:none;stroke:var(--gold);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .4s}
.timer-ring .tr-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-ring .tr-time{font-family:var(--font-mono);font-size:2.5rem;font-weight:500;letter-spacing:.02em}
.timer-ring .tr-label{font-size:.72rem;color:rgba(250,247,242,.55);margin-top:2px}
.sess-meta{display:flex;justify-content:center;gap:20px;margin-top:18px}
.sess-meta .sm{text-align:center}
.sess-meta .sm small{font-size:.66rem;color:rgba(250,247,242,.5);display:block}
.sess-meta .sm b{font-family:var(--font-mono);font-size:.94rem;color:var(--gold)}
.sess-state{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:.4rem 1rem;font-size:.78rem;font-weight:600;margin-top:6px}
.ss-pending{background:rgba(184,149,90,.16);color:var(--gold-deep)}
.ss-active{background:rgba(94,125,90,.18);color:#8FB07E}
.ss-expiring{background:rgba(184,68,47,.2);color:#E5967F}
.ss-expired{background:rgba(154,51,36,.24);color:#E5967F}
.sess-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sess-actions .btn{font-size:.82rem;min-height:52px}
.notif-pop{background:rgba(184,68,47,.12);border:1px solid rgba(184,68,47,.3);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-top:14px}
.notif-pop svg{width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:1.8;flex-shrink:0}
.notif-pop p{font-size:.8rem;color:var(--brown);font-weight:500}

/* reservations */
.chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time-chip{padding:.6rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--font-mono);font-size:.82rem;text-align:center;font-weight:500;color:var(--ink-soft);transition:all .2s}
.time-chip.on{background:var(--gold-faint);border-color:var(--gold);color:var(--gold-deep)}
.time-chip.off{opacity:.4;text-decoration:line-through}
.policy-box{background:var(--surface-2);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:12px;padding:13px 15px;margin-top:14px}
.policy-box h5{font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:8px}
.policy-box p{font-size:.76rem;color:var(--brown-soft);margin-top:6px;line-height:1.7}

/* confirmation */
.confirm-wrap{text-align:center;padding:20px}
.confirm-tick{width:88px;height:88px;border-radius:50%;background:var(--gold-faint);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:pop .5s var(--ease-spring)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.confirm-tick svg{width:44px;height:44px;stroke:var(--gold-deep);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.confirm-code{font-family:var(--font-mono);font-size:1.6rem;letter-spacing:.2em;color:var(--gold-deep);margin-top:6px}

/* generic list rows (profile/support/notifications) */
.list-row{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-row .lr-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-row .lr-ic svg{width:20px;height:20px;stroke:var(--gold-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.list-row .lr-b{flex:1}
.list-row h5{font-size:.92rem;font-weight:600}
.list-row p{font-size:.74rem;color:var(--brown-soft);margin-top:1px;line-height:1.5}
.list-row .lr-arrow{color:var(--brown-soft)}
.list-row.unread{background:var(--gold-faint);margin-inline:-18px;padding-inline:18px;border-radius:12px}

/* feature banner (student/family) */
.feat-hero{border-radius:0 0 26px 26px;padding:60px 18px 24px;color:var(--bg);position:relative;overflow:hidden}
.feat-hero .fh-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,16,.55),rgba(20,17,16,.88))}
.feat-hero .fh-c{position:relative;z-index:2}
.feat-hero h2{font-size:1.5rem;font-weight:700}
.feat-hero p{font-size:.86rem;color:rgba(250,247,242,.75);margin-top:8px;max-width:32ch}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat-card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px}
.feat-card .fc-ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.feat-card .fc-ic svg{width:21px;height:21px;stroke:var(--gold-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.feat-card h5{font-size:.9rem;font-weight:600}
.feat-card p{font-size:.74rem;color:var(--brown-soft);margin-top:4px;line-height:1.6}

/* toast */
.toast{position:absolute;bottom:100px;inset-inline:20px;background:var(--dark);color:var(--bg);
  border:1px solid rgba(184,149,90,.5);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;
  font-size:.84rem;z-index:70;transform:translateY(140%);opacity:0;transition:transform .4s var(--ease-spring),opacity .3s}
.toast.show{transform:none;opacity:1}
.toast svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;flex-shrink:0}

/* section spacing helpers */
.stack>*+*{margin-top:16px}
.divider{height:1px;background:var(--line);margin:4px 0}
.reveal{opacity:0;transform:translateY(16px);animation:rv .6s var(--ease-out) forwards}
@keyframes rv{to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;transition-duration:.05s!important}
  .splash-load i{width:100%}
}
@media (max-width:420px){
  .stage-head{margin-bottom:12px}
  .stage-head h1{font-size:1.2rem}
}

/* ================= LIQUID GLASS (iOS 26) ================= */
/* Warm-cream adaptive glass on light surfaces.
   NOTE: do not override layout position of tabbar/toast/sticky-bar/appbar/menu-tabs. */
.qr-fab{position:relative;isolation:isolate}
.qa{isolation:isolate}
/* --- bottom tab bar --- */
.tabbar{
  background:linear-gradient(180deg,rgba(255,253,250,.62),rgba(244,237,225,.5));
  -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.5);
  border-radius:30px 30px 0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 10px rgba(184,149,90,.08),
             0 -10px 30px -18px rgba(20,17,16,.4);
  overflow:hidden;
}
.tabbar::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.55),transparent 60%);}
/* --- app bar (top nav) --- */
.appbar{
  background:linear-gradient(180deg,rgba(255,253,250,.72),rgba(250,247,242,.5));
  -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 6px 20px -16px rgba(20,17,16,.4);
}
.appbar.on-surface{background:linear-gradient(180deg,rgba(255,253,250,.7),rgba(244,237,225,.55))}
/* --- menu tabs strip --- */
.menu-tabs{
  background:linear-gradient(180deg,rgba(255,253,250,.72),rgba(250,247,242,.5));
  -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
}
.menu-tab{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
/* --- sticky add bar --- */
.sticky-bar{
  background:linear-gradient(180deg,rgba(250,247,242,.55),rgba(255,253,250,.78));
  -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.6);
  border-radius:26px 26px 0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 -8px 26px -18px rgba(20,17,16,.4);
}
/* --- toast: adaptive dark glass --- */
.toast{
  background:linear-gradient(180deg,rgba(38,30,24,.72),rgba(20,17,16,.82));
  -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(184,149,90,.45);border-radius:22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -1px 8px rgba(0,0,0,.35), 0 20px 40px -18px rgba(0,0,0,.6);
}
.toast::before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:radial-gradient(100% 60% at 20% 0%,rgba(255,255,255,.14),transparent 60%)}
/* --- floating quick-action chips --- */
.qa{
  background:linear-gradient(160deg,rgba(255,253,250,.75),rgba(244,237,225,.55));

  function rnd(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
  function finder(cx,cy){
    cells+='<rect x="'+cx+'" y="'+cy+'" width="7" height="7" fill="#141110"/>';
    cells+='<rect x="'+(cx+1)+'" y="'+(cy+1)+'" width="5" height="5" fill="#FAF7F2"/>';
    cells+='<rect x="'+(cx+2)+'" y="'+(cy+2)+'" width="3" height="3" fill="#141110"/>';
  }
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
    if(inF)continue;
    if(rnd()>.55)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#141110"/>';

  svg.setAttribute('viewBox','0 0 29 29');
  svg.innerHTML='<rect width="29" height="29" fill="#FAF7F2"/>'+cells;
}

function pdChip(id,i){$$('#'+id+' .opt-chip').forEach(function(c,idx){c.classList.toggle('on',idx===i)})}

/* ================= SESSION + TIMER ================= */
function fmt(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss}
function buildSession(){
  var el=$('#s-session')||makeScreen('session');
  var tm=state.timer;
  var orderReady=state.order.stage>=2;
  var stateCls,stateLabel,stateIc='';
  if(!tm.started){stateCls='ss-pending';stateLabel=L('الطلب قيد التحضير — لم يبدأ الوقت','Preparing — timer not started')}
  else if(tm.remaining<=0){stateCls='ss-expired';stateLabel=L('انتهى الوقت','Time expired')}
  else if(tm.remaining<=300){stateCls='ss-expiring';stateLabel=L('على وشك الانتهاء','Expiring soon')}
  else {stateCls='ss-active';stateLabel=L('الجلسة نشطة','Session active')}
  var isTable=state.seat.indexOf('T')===0;
  var C=2*Math.PI*90;
  var frac=tm.total?tm.remaining/tm.total:0;
  var ringColor=tm.remaining<=300&&tm.started?'#E5967F':'var(--gold)';
  el.innerHTML=
    '<div class="scroll-area" id="sessScroll">'+
      '<div class="session-hero">'+
        '<span class="eyebrow" style="color:var(--gold)">'+L('جلستك الحالية','Current Session')+'</span>'+
        '<div class="sess-state '+stateCls+'" style="margin-top:10px">'+stateLabel+'</div>'+
        '<div class="timer-ring"><svg viewBox="0 0 210 210"><circle class="tr-bg" cx="105" cy="105" r="90"/>'+
          '<circle class="tr-fg" id="ringFg" cx="105" cy="105" r="90" stroke="'+ringColor+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-frac))+'"/></svg>'+
          '<div class="tr-center"><div class="tr-time" id="ringTime">'+(tm.started?fmt(tm.remaining):'60:00')+'</div><div class="tr-label">'+(tm.started?L('متبقٍ','remaining'):L('في الانتظار','on hold'))+'</div></div></div>'+
        '<div class="sess-meta"><div class="sm"><small>'+L('رقم الجلسة','Session')+'</small><b>'+state.session+'</b></div>'+
          '<div class="sm"><small>'+L('المقعد','Seat')+'</small><b>'+state.seat+'</b></div>'+
          '<div class="sm"><small>'+L('البداية','Start')+'</small><b id="startTime">'+(tm.started?nowPlus(0):'—')+'</b></div></div>'+
      '</div>'+
      '<div class="px mt">'+
        (!tm.started?
          (orderReady?
          '<button class="btn btn-gold" onclick="startTimer()"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg>'+L('ابدأ الجلسة','Start session')+'</button>':
          '<div class="card card-surf" style="text-align:center"><p class="muted">'+L('يبدأ العدّاد تلقائياً عند اعتماد طلبك "جاهز للتقديم".','The timer starts automatically once your order is marked "Ready for serving".')+'</p>'+
          '<button class="btn btn-gold mt" onclick="simReady()"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>'+L('محاكاة: الطلب جاهز','Demo: order ready')+'</button></div>')
        :'')+
        '<div id="notifSlot"></div>'+
        (tm.started?
        '<div class="sess-actions">'+
          '<button class="btn btn-gold" onclick="buyHour()"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>'+L('ساعة إضافية','Extra hour')+' · '+(isTable?20:5)+' '+L('ر.س','SAR')+'</button>'+
          '<button class="btn btn-dark" onclick="go(\'menu\')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+L('طلب إضافي','Order more')+'</button>'+
          '<button class="btn btn-ghost" style="grid-column:1/-1" onclick="leaveSeat()">'+L('غادرت المكان','I left my seat')+'</button>'+
        '</div>':'')+
        '<div class="card mt"><div class="sec-title">'+L('تفاصيل الجلسة','Session details')+'</div><div class="sd-rows mt-s">'+
          '<div class="row"><span>'+L('الفرع','Branch')+'</span><b>'+L('سترينجرز الملقا','Al Malqa')+'</b></div>'+
          '<div class="row"><span>'+L('نوع المقعد','Seat type')+'</span><b>'+L(isTable?'طاولة':'كرسي',isTable?'Table':'Chair')+'</b></div>'+
          '<div class="row"><span>'+L('الحد الأدنى','Minimum')+'</span><b class="mono">'+(isTable?40:13)+' '+L('ر.س','SAR')+'</b></div>'+
          '<div class="row"><span>'+L('حالة الطلب','Order status')+'</span><b>'+(orderReady?L('جاهز','Ready'):L('قيد التحضير','Preparing'))+'</b></div>'+
        '</div></div>'+
      '</div><div style="height:20px"></div>'+
    '</div>';
  renderNotifSlot();
}
function nowPlus(min){var d=new Date(Date.now()+min*60000);var h=d.getHours(),m=d.getMinutes();var ap=h>=12?'م':'ص';var h12=h%12||12;return (lang==='ar'?h12+':'+(m<10?'0':'')+m+' '+ap:h12+':'+(m<10?'0':'')+m+(h>=12?' PM':' AM'))}
function simReady(){state.order.stage=2;startTimer();toast(L('طلبك جاهز — بدأ وقت جلستك','Order ready — session started'))}
function startTimer(){
  var tm=state.timer;
  if(tm.running)return;
  tm.started=true;tm.running=true;tm.total=Math.max(tm.total,tm.remaining||3600);if(!tm.remaining)tm.remaining=3600;
  buildSession();
  clearInterval(tm.int);
  tm.int=setInterval(tickTimer,1000);
}
function tickTimer(){
  var tm=state.timer;
  if(tm.remaining>0){tm.remaining--;updateRing();
    if(tm.remaining===300&&!tm.fiveWarned){tm.fiveWarned=true;renderNotifSlot();toast(L('تبقّى 5 دقائق على انتهاء جلستك','5 minutes left in your session'))}
    if(tm.remaining===0){clearInterval(tm.int);tm.running=false;buildSession();toast(L('انتهى وقت جلستك','Your session time is up'))}
  }
}
function updateRing(){
  var tm=state.timer,C=2*Math.PI*90;
  var fg=$('#ringFg'),tEl=$('#ringTime');
  if(!fg||!tEl)return;
  var frac=tm.total?tm.remaining/tm.total:0;
  fg.setAttribute('stroke-dashoffset',C*(1-frac));
  fg.setAttribute('stroke',tm.remaining<=300?'#E5967F':'var(--gold)');
  tEl.textContent=fmt(tm.remaining);
  // update state pill without full rebuild
  var pill=$('#s-session .sess-state');
  if(pill){
    pill.className='sess-state '+(tm.remaining<=0?'ss-expired':tm.remaining<=300?'ss-expiring':'ss-active');
    pill.textContent=tm.remaining<=0?L('انتهى الوقت','Time expired'):tm.remaining<=300?L('على وشك الانتهاء','Expiring soon'):L('الجلسة نشطة','Session active');
  }
}
function renderNotifSlot(){
  var slot=$('#notifSlot');if(!slot)return;
  var tm=state.timer;
  if(tm.started&&tm.remaining<=300&&tm.remaining>0){
    slot.innerHTML='<div class="notif-pop"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><p>'+L('تبقّى أقل من 5 دقائق — مدّد جلستك أو أضف طلباً.','Under 5 minutes left — extend or order more.')+'</p></div>';
  }else slot.innerHTML='';
}
function buyHour(){
  var isTable=state.seat.indexOf('T')===0;
  state.timer.remaining+=3600;state.timer.total+=3600;state.timer.fiveWarned=false;
  updateRing();renderNotifSlot();
  toast(L('أُضيفت ساعة — خُصم '+(isTable?20:5)+' ريال','Added 1 hour — '+(isTable?20:5)+' SAR charged'));
  buildSession();startTimer();
}
function leaveSeat(){
  clearInterval(state.timer.int);
  state.timer={started:false,running:false,remaining:3600,total:3600,int:null,fiveWarned:false,expiredWarned:false};
  state.order.active=false;
  toast(L('انتهت جلستك — نراك قريباً','Session ended — see you soon'));
  buildSession();
}

/* ================= ROUTER ================= */
var NO_TAB=['splash','onboard','register','otp','product','cart','checkout','bookingConfirm'];
var DARK_STATUS=['splash','session'];
var BUILDERS={home:buildHome,membership:buildMembership,qr:buildQr,branches:buildBranches,branchDetail:buildBranchDetail,
  seating:buildSeating,menu:buildMenu,product:buildProduct,cart:buildCart,checkout:buildCheckout,tracking:buildTracking,
  session:buildSession,reserve:buildReserve,bookingConfirm:buildBookingConfirm,student:buildStudent,family:buildFamily,
  rewards:buildRewards,events:buildEvents,story:buildStory,discover:buildDiscover,notif:buildNotif,profile:buildProfile,support:buildSupport};
var TAB_MAP={home:'home',menu:'menu',session:'session',profile:'profile'};

function go(id,isBack){
  if(BUILDERS[id])BUILDERS[id]();
  var target=$('#s-'+id);
  if(!target)return;
  if(!isBack && state.screen && state.screen!==id){state.prevStack.push(state.screen)}
  $$('.app-screen').forEach(function(s){s.classList.remove('active','back-in')});
  if(isBack)target.classList.add('back-in');
  target.classList.add('active');
  state.screen=id;
  // tabbar
  var tb=$('#tabbar');
  tb.classList.toggle('hidden',NO_TAB.indexOf(id)>-1);
  $$('.tab').forEach(function(t){t.classList.toggle('active',TAB_MAP[id]===t.getAttribute('data-tab'))});
  // status bar color
  $('#statusbar').classList.toggle('on-dark',DARK_STATUS.indexOf(id)>-1||id==='branchDetail'||id==='product'||id==='student'||id==='family'||id==='profile');
  // scroll reset
  var sa=target.querySelector('.scroll-area');if(sa)sa.scrollTop=0;
  applyI18n();
}
function back(){
  var prev=state.prevStack.pop();
  if(prev)go(prev,true);else go('home',true);
}

/* ================= TOAST ================= */
var toastTimer;
function toast(msg){
  var el=$('#toast');$('#toastMsg').textContent=msg;
  el.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show')},2600);
}

/* ================= EVENTS / INIT ================= */
function setLang(l){
  lang=l;
  document.documentElement.setAttribute('lang',l);
  document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
  $('#langBtn').textContent=l==='ar'?'EN':'ع';
  // rebuild current screen fresh
  applyI18n();
  var cur=state.screen;
  // clear cached screens that hold translated markup
  Object.keys(BUILDERS).forEach(function(id){var e=$('#s-'+id);if(e && id!=='splash')e.innerHTML='__stale__'});
  $$('.app-screen').forEach(function(e){if(e.innerHTML==='__stale__'){/* will rebuild on visit */}});
  // simplest: remove dynamic screens so they rebuild
  Object.keys(BUILDERS).forEach(function(id){var e=$('#s-'+id);if(e)e.remove()});
  go(cur,true);
}
$('#langBtn').addEventListener('click',function(){setLang(lang==='ar'?'en':'ar')});
$('#restartBtn').addEventListener('click',function(){
  clearInterval(state.timer.int);
  state.cart=[];state.order={active:true,stage:1};
  state.timer={started:false,running:false,remaining:3600,total:3600,int:null,fiveWarned:false,expiredWarned:false};
  state.prevStack=[];updateCartBadge();
  Object.keys(BUILDERS).forEach(function(id){var e=$('#s-'+id);if(e)e.remove()});
  go('splash',true);
  setTimeout(function(){if(state.screen==='splash')go('onboard')},2600);
});

/* onboarding interactions */
function initOnboard(){
  var track=$('#onbTrack'),next=$('#onbNext'),dots=$$('#onbDots i');
  if(!track)return;
  track.addEventListener('scroll',function(){
    var idx=Math.round(track.scrollLeft/track.clientWidth);idx=Math.abs(idx);
    dots.forEach(function(d,i){d.classList.toggle('on',i===idx)});
    next.textContent=idx>=2?L('ابدأ الآن','Get Started'):L('التالي','Next');
  });
  next.addEventListener('click',function(){
    var idx=Math.round(Math.abs(track.scrollLeft)/track.clientWidth);
    if(idx>=2){go('register')}
    else{track.scrollTo({left:(lang==='ar'?-1:1)*(idx+1)*track.clientWidth,behavior:'smooth'})}
  });
}

/* register form */
document.addEventListener('submit',function(e){
  if(e.target.id!=='regForm')return;
  e.preventDefault();
  var f=e.target,ok=true;
  var name=f.name.value.trim(),phone=f.phone.value.trim(),email=f.email.value.trim(),city=f.city.value,agree=f.agree.checked;
  function mark(field,bad){var fl=f.querySelector('[name="'+field+'"]').closest('.field');fl.classList.toggle('invalid',bad);if(bad)ok=false}
  mark('name',name.length<2);
  mark('phone',!/^05\d{8}$/.test(phone));
  mark('email',email.length>0 && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email));
  mark('city',!city);
  $('#agreeErr').style.display=agree?'none':'block';if(!agree)ok=false;
  if(ok){go('home')}
});

/* OTP interactions */
document.addEventListener('input',function(e){
  if(!e.target.closest('#otpRow'))return;
  var inputs=$$('#otpRow input');var i=inputs.indexOf(e.target);
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);
  if(e.target.value && i<inputs.length-1)inputs[i+1].focus();
});
document.addEventListener('keydown',function(e){
  if(!e.target.closest('#otpRow'))return;
  if(e.key==='Backspace' && !e.target.value){var inputs=$$('#otpRow input');var i=inputs.indexOf(e.target);if(i>0)inputs[i-1].focus()}
});
document.addEventListener('click',function(e){
  if(e.target.id==='otpVerify'){go('home')}
});
function initOtpTimer(){
  var t=30;var el=$('#otpTimer b');if(!el)return;
  clearInterval(window._otpInt);
  window._otpInt=setInterval(function(){
    t--;var el2=$('#otpTimer');if(!el2){clearInterval(window._otpInt);return}
    if(t<=0){clearInterval(window._otpInt);el2.innerHTML='<span class="otp-resend" style="cursor:pointer">'+L('إعادة الإرسال','Resend code')+'</span>';
      el2.querySelector('.otp-resend').addEventListener('click',function(){initOtpTimer2()});return}
    var b=el2.querySelector('b');if(b)b.textContent='00:'+(t<10?'0':'')+t;
  },1000);
}
function initOtpTimer2(){$('#otpTimer').innerHTML=L('إعادة الإرسال خلال ','Resend in ')+'<b>00:30</b>';initOtpTimer();toast(L('أُرسل رمز جديد','New code sent'))}

/* hook screen-specific init after go() */
var _go=go;
go=function(id,isBack){_go(id,isBack);
  if(id==='onboard')setTimeout(initOnboard,30);
  if(id==='otp')setTimeout(initOtpTimer,30);
  if(id==='session')renderNotifSlot();
};

/* clock */
function tickClock(){var d=new Date();var h=d.getHours()%12||12;var m=d.getMinutes();$('#sbTime').textContent=h+':'+(m<10?'0':'')+m}
tickClock();setInterval(tickClock,10000);

/* device tilt with mouse */
(function(){
  var wrap=$('#phoneWrap');
  if(window.matchMedia('(pointer:coarse)').matches)return;
  document.addEventListener('mousemove',function(e){
    var x=e.clientX/window.innerWidth-.5, y=e.clientY/window.innerHeight-.5;
    wrap.style.transform='rotateY('+(x*10)+'deg) rotateX('+(-y*8)+'deg)';
  });
})();

/* gold dust */
(function(){
  var bg=$('#protoBg');var n=18;
  for(var i=0;i<n;i++){
    var d=document.createElement('span');d.className='dust';
    d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
    d.style.setProperty('--dur',(9+Math.random()*8)+'s');
    d.style.setProperty('--dl',(Math.random()*6)+'s');
    d.style.setProperty('--dx',(Math.random()*30-15)+'px');
    d.style.setProperty('--dy',(-20-Math.random()*30)+'px');
    bg.appendChild(d);
  }
})();

/* press ripple on glass elements */
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest('.tab,.qa,.menu-item,.rail-card,.qr-fab');
  if(!g)return;g.style.transition='transform .12s';g.style.transform='scale(.96)';
  setTimeout(function(){g.style.transform=''},140);
});

/* ================= BOOT ================= */
go('splash',true);
setTimeout(function(){if(state.screen==='splash')go('onboard')},2600);
updateCartBadge();
</script>
